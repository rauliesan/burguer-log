<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-icon">🍔</span>
      <h1>Crear Cuenta</h1>
      <p>Registra tu restaurante en Burguer Log</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }

      <div class="form-group">
        <label for="name">Nombre del restaurante *</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Mi Burguer" />
      </div>

      <div class="form-group">
        <label for="address">Dirección</label>
        <input id="address" type="text" [(ngModel)]="address" name="address" placeholder="Calle Principal 1" />
      </div>

      <div class="form-group">
        <label for="town">Ciudad</label>
        <input id="town" type="text" [(ngModel)]="town" name="town" placeholder="Madrid" />
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <p class="auth-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
